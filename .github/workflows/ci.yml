name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Semanal aunque nadie pushee: el test canario del salario mínimo avisa
  # cuando la tabla de escalones se queda sin el mes actual.
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Vulnerabilidades conocidas en dependencias de producción: falla con high o critical.
      - run: npm audit --omit=dev --audit-level=high
